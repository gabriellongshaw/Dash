<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://www.gstatic.com https://apis.google.com; connect-src 'self' https://*.googleapis.com https://*.firebaseapp.com https://*.firebaseio.com https://*.vercel.app; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'; font-src 'self'; frame-src https://*.firebaseapp.com https://accounts.google.com; object-src 'none'; base-uri 'self'; form-action 'self'; manifest-src 'self'">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="description" content="Play Dash, a fast, modern 2D endless runner.">
  <meta name="author" content="Gabriel Longshaw">
  <title>Dash</title>
  <meta name="theme-color" content="#f3faf6" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0b1512" media="(prefers-color-scheme: dark)">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="icon" type="image/svg+xml" href="../assets/images/icon.svg">
  <link rel="stylesheet" href="../assets/css/variables.css">
  <link rel="stylesheet" href="../assets/css/fonts.css">
  <link rel="stylesheet" href="../assets/css/main.css">
  <link rel="stylesheet" href="../assets/css/animations.css">
  <link rel="stylesheet" href="../assets/css/components/screens.css">
  <link rel="stylesheet" href="../assets/css/components/buttons.css">
  <link rel="stylesheet" href="../assets/css/components/hud.css">
  <link rel="stylesheet" href="../assets/css/components/modal.css">
  <link rel="stylesheet" href="../assets/css/components/account.css">
  <link rel="stylesheet" href="../assets/css/responsive.css">
</head>
<body>
  <div class="page">
    <canvas id="game-canvas" class="stage-canvas"></canvas>

    <div class="hud">
      <button class="leave-button" id="menu-btn" aria-label="Back to menu">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
        <span class="leave-label">Menu</span>
      </button>
      <div class="score-block">
        <div class="score" id="score">0</div>
        <div class="best" id="best">Best 0</div>
      </div>
      <div class="hud-right">
        <div class="coin-pill"><span class="coin-dot"></span><span id="coins">0</span></div>
        <button class="icon-button" id="pause-btn" aria-label="Pause">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4.5" height="14" rx="1.5"/><rect x="13.5" y="5" width="4.5" height="14" rx="1.5"/></svg>
        </button>
      </div>
    </div>

    <div class="start-hint" id="start-hint">
      <p class="hint-title"><span class="desktop-only">Press Space to start</span><span class="touch-only">Tap to start</span></p>
      <p class="hint-sub"><span class="desktop-only">Space / &uarr; jump &middot; &darr; slide &middot; double jump in the air</span><span class="touch-only">Tap to jump &middot; hold to slide</span></p>
    </div>

    <div class="controls">
      <button class="control-btn" id="btn-slide" aria-label="Slide">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14"/><path d="m18 13-6 6-6-6"/></svg>
      </button>
      <button class="control-btn control-jump" id="btn-jump" aria-label="Jump">
        <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5"/><path d="m6 11 6-6 6 6"/></svg>
      </button>
    </div>

    <div class="overlay hidden" id="pause-overlay">
      <div class="modal">
        <h2>Paused</h2>
        <button class="button" id="resume-btn">Resume</button>
        <button class="secondary-button" id="quit-btn">Menu</button>
      </div>
    </div>

    <div class="overlay hidden" id="over-overlay">
      <div class="modal">
        <h2>Game over</h2>
        <div class="modal-score" id="over-score">0</div>
        <span class="badge-best hidden" id="over-badge">New best</span>
        <div class="stat-row">
          <div class="stat"><span class="stat-value" id="over-best">0</span><span class="stat-label">Best</span></div>
          <div class="stat"><span class="stat-value" id="over-coins">0</span><span class="stat-label">Coins</span></div>
          <div class="stat"><span class="stat-value" id="over-distance">0 m</span><span class="stat-label">Distance</span></div>
        </div>
        <button class="button" id="again-btn">Play again</button>
        <div class="modal-row">
          <button class="secondary-button" id="over-shop-btn">Shop</button>
          <button class="secondary-button" id="over-menu-btn">Menu</button>
        </div>
        <p class="modal-note hidden" id="over-quests">
          <span id="over-quests-text"></span>
          <button class="tertiary-button" id="over-quests-btn">Claim</button>
        </p>
        <p class="modal-note hidden" id="over-note">
          <span>Sign in to save your coins.</span>
          <button class="tertiary-button" id="over-signin">Sign in</button>
        </p>
      </div>
    </div>
  </div>
  <script type="module" src="../assets/js/pages/game.js"></script>
</body>
</html>
