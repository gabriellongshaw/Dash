<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://www.gstatic.com https://apis.google.com; connect-src 'self' https://*.googleapis.com https://*.firebaseapp.com https://*.firebaseio.com https://*.vercel.app; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'; font-src 'self'; frame-src https://*.firebaseapp.com https://accounts.google.com; object-src 'none'; base-uri 'self'; form-action 'self'; manifest-src 'self'">
  <script src="../assets/js/core/shell.js"></script>
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="See a Dash player's profile and stats, and manage your privacy.">
  <meta name="author" content="Gabriel Longshaw">
  <title>Dash Profile</title>
  <meta name="theme-color" content="#f3faf6" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0b1512" media="(prefers-color-scheme: dark)">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="icon" type="image/svg+xml" href="../assets/images/icon.svg">
  <link rel="stylesheet" href="../assets/css/variables.css">
  <link rel="stylesheet" href="../assets/css/fonts.css">
  <link rel="stylesheet" href="../assets/css/main.css">
  <link rel="stylesheet" href="../assets/css/animations.css">
  <link rel="stylesheet" href="../assets/css/components/screens.css">
  <link rel="stylesheet" href="../assets/css/components/buttons.css">
  <link rel="stylesheet" href="../assets/css/components/hud.css">
  <link rel="stylesheet" href="../assets/css/components/account.css">
  <link rel="stylesheet" href="../assets/css/components/shop.css">
  <link rel="stylesheet" href="../assets/css/components/board.css">
  <link rel="stylesheet" href="../assets/css/components/modal.css">
  <link rel="stylesheet" href="../assets/css/components/friends.css">
  <link rel="stylesheet" href="../assets/css/components/player.css">
  <link rel="stylesheet" href="../assets/css/responsive.css">
</head>
<body>
  <div class="page shop-page board-page friends-page player-page">
    <div class="shop-scroll" id="scroll">
      <div class="shop-inner">
        <p class="shop-note hidden" id="note">
          <span>Sign in to view profiles.</span>
          <button class="tertiary-button" id="note-signin">Sign in</button>
        </p>
        <div class="friends-stack hidden" id="content"></div>
      </div>
    </div>

    <div class="shop-bar">
      <button class="leave-button" id="back-btn" aria-label="Back">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
        <span class="leave-label">Back</span>
      </button>
      <div class="shop-bar-right">
        <div class="coin-pill"><span class="coin-dot"></span><span id="wallet">0</span></div>
        <div class="account" id="account"></div>
      </div>
    </div>
  </div>
  <script type="module" src="../assets/js/pages/player.js"></script>
</body>
</html>
