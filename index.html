<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://www.gstatic.com https://apis.google.com; connect-src 'self' https://*.googleapis.com https://*.firebaseapp.com https://*.firebaseio.com https://*.vercel.app; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'; font-src 'self'; frame-src https://*.firebaseapp.com https://accounts.google.com; object-src 'none'; base-uri 'self'; form-action 'self'; manifest-src 'self'">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Dash is a fast, modern 2D endless runner. Jump, slide and collect coins.">
  <meta name="keywords" content="Dash, endless runner, 2D runner, web game, Gabriel Longshaw">
  <meta name="author" content="Gabriel Longshaw">
  <title>Dash</title>
  <meta name="theme-color" content="#f3faf6" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0b1512" media="(prefers-color-scheme: dark)">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta property="og:title" content="Dash">
  <meta property="og:description" content="A fast, modern 2D endless runner.">
  <meta property="og:image" content="assets/images/preview.png">
  <link rel="icon" type="image/svg+xml" href="assets/images/icon.svg">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="assets/css/variables.css">
  <link rel="stylesheet" href="assets/css/fonts.css">
  <link rel="stylesheet" href="assets/css/main.css">
  <link rel="stylesheet" href="assets/css/animations.css">
  <link rel="stylesheet" href="assets/css/components/screens.css">
  <link rel="stylesheet" href="assets/css/components/buttons.css">
  <link rel="stylesheet" href="assets/css/components/account.css">
  <link rel="stylesheet" href="assets/css/components/hud.css">
  <link rel="stylesheet" href="assets/css/responsive.css">
</head>
<body>
  <div class="page">
    <canvas id="home-canvas" class="stage-canvas"></canvas>
    <div class="home-account account" id="account"></div>
    <nav class="home-nav" aria-label="Menu">
      <a href="quests/" class="nav-button" id="quests-btn" aria-label="Quests">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/></svg>
        <span class="nav-label">Quests</span>
        <span class="badge-dot hidden" id="quests-badge"></span>
      </a>
      <a href="leaderboard/" class="nav-button" id="board-btn" aria-label="Leaderboard">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 21h8"/><path d="M12 17v4"/><path d="M7 4h10v5a5 5 0 0 1-10 0Z"/><path d="M17 5h3v2a3 3 0 0 1-3 3"/><path d="M7 5H4v2a3 3 0 0 0 3 3"/></svg>
        <span class="nav-label">Leaderboard</span>
      </a>
      <a href="friends/" class="nav-button" id="friends-btn" aria-label="Friends">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
        <span class="nav-label">Friends</span>
        <span class="badge-dot hidden" id="friends-badge"></span>
      </a>
    </nav>
    <div class="home-content">
      <h1>Dash</h1>
      <p class="tagline">Run. Jump. Slide. Don't stop.</p>
      <a href="play/" class="button" id="play-btn">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l10.5-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5Z"/></svg>
        Play
      </a>
      <a href="shop/" class="secondary-button" id="shop-btn">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"/><path d="M3 6h18"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
        Shop
      </a>
      <p class="home-best" id="home-best"></p>
      <div class="key-hints">
        <span class="key-chip desktop-only"><kbd>Space</kbd> Jump</span>
        <span class="key-chip desktop-only"><kbd>&darr;</kbd> Slide</span>
        <span class="key-chip touch-only"><kbd>Tap</kbd> Jump</span>
        <span class="key-chip touch-only"><kbd>Hold</kbd> Slide</span>
      </div>
    </div>
    <div class="credits-container">
      <p><span class="credits-copyright">&copy;</span> 2026 Gabriel Longshaw. All rights reserved.</p>
      <p>Created by <a class="credits-link" target="_blank" rel="noopener" href="https://www.gabriellongshaw.co.uk">Gabriel Longshaw</a></p>
    </div>
  </div>
  <script type="module" src="assets/js/pages/home.js"></script>
</body>
</html>
