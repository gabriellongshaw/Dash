<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Dash is a fast, modern 2D endless runner. Jump, slide and collect coins.">
  <meta name="keywords" content="Dash, endless runner, 2D runner, web game, Gabriel Longshaw">
  <meta name="author" content="Gabriel Longshaw">
  <title>Dash</title>
  <meta name="theme-color" content="#f3faf6" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0b1512" media="(prefers-color-scheme: dark)">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta property="og:title" content="Dash">
  <meta property="og:description" content="A fast, modern 2D endless runner.">
  <meta property="og:image" content="assets/images/preview.png">
  <link rel="icon" type="image/svg+xml" href="assets/images/icon.svg">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="assets/css/variables.css">
  <link rel="stylesheet" href="assets/css/fonts.css">
  <link rel="stylesheet" href="assets/css/main.css">
  <link rel="stylesheet" href="assets/css/animations.css">
  <link rel="stylesheet" href="assets/css/components/screens.css">
  <link rel="stylesheet" href="assets/css/components/buttons.css">
  <link rel="stylesheet" href="assets/css/components/account.css">
  <link rel="stylesheet" href="assets/css/components/hud.css">
  <link rel="stylesheet" href="assets/css/responsive.css">
</head>
<body>
  <div class="page">
    <canvas id="home-canvas" class="stage-canvas"></canvas>
    <div class="home-account account" id="account"></div>
    <div class="home-content">
      <h1>Dash</h1>
      <p class="tagline">Run. Jump. Slide. Don't stop.</p>
      <a href="play/" class="button" id="play-btn">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l10.5-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5Z"/></svg>
        Play
      </a>
      <a href="shop/" class="secondary-button" id="shop-btn">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"/><path d="M3 6h18"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
        Shop
      </a>
      <p class="home-best" id="home-best"></p>
      <div class="key-hints">
        <span class="key-chip desktop-only"><kbd>Space</kbd> Jump</span>
        <span class="key-chip desktop-only"><kbd>&darr;</kbd> Slide</span>
        <span class="key-chip touch-only"><kbd>Tap</kbd> Jump</span>
        <span class="key-chip touch-only"><kbd>Hold</kbd> Slide</span>
      </div>
    </div>
    <div class="credits-container">
      <p><span class="credits-copyright">&copy;</span> 2026 Gabriel Longshaw. All rights reserved.</p>
      <p>Created by <a class="credits-link" target="_blank" rel="noopener" href="https://www.gabriellongshaw.co.uk">Gabriel Longshaw</a></p>
    </div>
  </div>
  <script type="module" src="assets/js/pages/home.js"></script>
</body>
</html>
