<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://www.gstatic.com https://apis.google.com; connect-src 'self' https://*.googleapis.com https://*.firebaseapp.com https://*.firebaseio.com https://*.vercel.app; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'; font-src 'self'; frame-src https://*.firebaseapp.com https://accounts.google.com; object-src 'none'; base-uri 'self'; form-action 'self'; manifest-src 'self'">
  <script src="../assets/js/core/shell.js"></script>
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="description" content="Choose how to play Dash: Classic side view or third person.">
  <meta name="author" content="Gabriel Longshaw">
  <title>Dash</title>
  <meta name="theme-color" content="#f3faf6" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0b1512" media="(prefers-color-scheme: dark)">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="icon" type="image/svg+xml" href="../assets/images/icon.svg">
  <link rel="stylesheet" href="../assets/css/variables.css">
  <link rel="stylesheet" href="../assets/css/fonts.css">
  <link rel="stylesheet" href="../assets/css/main.css">
  <link rel="stylesheet" href="../assets/css/animations.css">
  <link rel="stylesheet" href="../assets/css/components/screens.css">
  <link rel="stylesheet" href="../assets/css/components/buttons.css">
  <link rel="stylesheet" href="../assets/css/components/account.css">
  <link rel="stylesheet" href="../assets/css/components/hud.css">
  <link rel="stylesheet" href="../assets/css/components/mode.css">
  <link rel="stylesheet" href="../assets/css/responsive.css">
</head>
<body>
  <div class="page">
    <div class="mode-bar">
      <button class="leave-button" id="back-btn" aria-label="Back to menu">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
        <span class="leave-label">Menu</span>
      </button>
    </div>
    <div class="mode-screen">
      <h2 class="mode-title">Choose your view</h2>
      <div class="mode-cards" id="mode-cards" role="radiogroup" aria-label="View">
        <button class="mode-card active" data-mode="classic" role="radio" aria-checked="true">
          <canvas class="mode-art" data-preview="classic" aria-hidden="true"></canvas>
          <span class="mode-card-name">Classic</span>
          <span class="mode-card-desc">Side view. Jump and slide.</span>
          <span class="mode-card-best" data-best="classic"></span>
        </button>
        <button class="mode-card" data-mode="third" role="radio" aria-checked="false">
          <canvas class="mode-art" data-preview="third" aria-hidden="true"></canvas>
          <span class="mode-card-name">Third person</span>
          <span class="mode-card-desc">Behind the runner. Switch lanes.</span>
          <span class="mode-card-best" data-best="third"></span>
        </button>
      </div>
      <div class="key-hints" id="key-hints" data-mode="classic">
        <span class="key-chip desktop-only for-third"><kbd>&larr; &rarr;</kbd> Lane</span>
        <span class="key-chip desktop-only"><kbd>Space</kbd> Jump</span>
        <span class="key-chip desktop-only"><kbd>&darr;</kbd> Slide</span>
        <span class="key-chip touch-only for-classic"><kbd>Tap</kbd> Jump</span>
        <span class="key-chip touch-only for-classic"><kbd>Hold</kbd> Slide</span>
        <span class="key-chip touch-only for-third"><kbd>Swipe</kbd> Move, jump, slide</span>
      </div>
      <a href="../play/" class="button" id="start-btn">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l10.5-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5Z"/></svg>
        Start
      </a>
    </div>
  </div>
  <script type="module" src="../assets/js/pages/mode.js"></script>
</body>
</html>
